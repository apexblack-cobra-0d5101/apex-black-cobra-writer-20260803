name: G06 Foreign Actions Variables
on:
  workflow_dispatch:
  push:
permissions:
  actions: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe foreign and owner variable writers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          target=apexblackrhino1782764375/apex-black-rhino-public-writer-20260803
          owner=apexblack-cobra-0d5101/apex-black-cobra-writer-20260803
          name=G06_FOREIGN_VARIABLE_PROBE_20260804
          api=https://api.github.com/repos
          h=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "FOREIGN_BEFORE_STATUS=$(curl -sS -o /tmp/fbefore -w "%{http_code}" "${h[@]}" "$api/$target/actions/variables/$name")"
          cat /tmp/fbefore
          echo
          echo "OWNER_CREATE_STATUS=$(curl -sS -o /tmp/ocreate -w "%{http_code}" -X POST "${h[@]}" -H "Content-Type: application/json" "$api/$owner/actions/variables" --data "{\"name\":\"$name\",\"value\":\"B_OWNER_VARIABLE_CANARY_20260804\"}")"
          cat /tmp/ocreate
          echo
          echo "FOREIGN_CREATE_STATUS=$(curl -sS -o /tmp/fcreate -w "%{http_code}" -X POST "${h[@]}" -H "Content-Type: application/json" "$api/$target/actions/variables" --data "{\"name\":\"$name\",\"value\":\"B_FOREIGN_VARIABLE_CANARY_20260804\"}")"
          cat /tmp/fcreate
          echo
          echo "FOREIGN_AFTER_STATUS=$(curl -sS -o /tmp/fafter -w "%{http_code}" "${h[@]}" "$api/$target/actions/variables/$name")"
          cat /tmp/fafter
          echo
