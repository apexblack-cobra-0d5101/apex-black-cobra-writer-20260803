name: G06 Foreign PR Merge Probe V2
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Probe A PR 3 merge from B fork
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          base=https://api.github.com/repos/apexblackrhino1782764375/apex-black-rhino-public-writer-20260803
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "BEFORE_STATUS=$(curl -sS -o /tmp/before -w "%{http_code}" "${auth[@]}" "$base/pulls/3")"
          cat /tmp/before
          echo
          echo "MERGE_STATUS=$(curl -sS -o /tmp/merge -w "%{http_code}" -X PUT "${auth[@]}" -H "Content-Type: application/json" "$base/pulls/3/merge" --data "{\"commit_title\":\"G06 foreign fork merge V2\",\"commit_message\":\"B unauthorized merge probe V2\",\"merge_method\":\"merge\"}")"
          cat /tmp/merge
          echo
          echo "AFTER_STATUS=$(curl -sS -o /tmp/after -w "%{http_code}" "${auth[@]}" "$base/pulls/3")"
          cat /tmp/after
          echo

