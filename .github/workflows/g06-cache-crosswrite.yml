name: G06 Artifact Foreign Finalizer Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare foreign artifact archive
        run: |
          mkdir -p artifact_probe
          echo B_ARTIFACT_FOREIGN_CANARY_V3 > artifact_probe/canary.txt
          zip -q -j out-foreign-artifact.zip artifact_probe/canary.txt
      - name: Probe A artifact finalizer
        uses: actions/github-script@v7
        env:
          TARGET_RUN_BACKEND_ID: "30869057094"
          TARGET_JOB_BACKEND_ID: "91867039871"
          ARTIFACT_NAME: "g06-foreign-artifact-v3"
        with:
          script: |
            const fs = require("fs");
            const crypto = require("crypto");
            const base = (process.env.ACTIONS_RESULTS_URL || "").replace(/\/$/, "");
            const token = process.env.ACTIONS_RUNTIME_TOKEN || "";
            const headers = { Authorization: "Bearer " + token, "Content-Type": "application/json", Accept: "application/json" };
            const createBody = { workflow_run_backend_id: process.env.TARGET_RUN_BACKEND_ID, workflow_job_run_backend_id: process.env.TARGET_JOB_BACKEND_ID, name: process.env.ARTIFACT_NAME, mime_type: "application/zip", version: 7 };
            const create = await fetch(base + "/twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact", { method: "POST", headers, body: JSON.stringify(createBody) });
            const createText = await create.text();
            console.log("ARTIFACT_CREATE_HTTP", create.status, createText);
            fs.mkdirSync("out-artifact", { recursive: true });
            fs.writeFileSync("out-artifact/create-request.json", JSON.stringify(createBody));
            fs.writeFileSync("out-artifact/create-response.json", createText);
            let uploadStatus = "not-run";
            let finalizeStatus = "not-run";
            if (create.ok) {
              const archive = fs.readFileSync("out-foreign-artifact.zip");
              const upload = await fetch(JSON.parse(createText).signed_upload_url, { method: "PUT", headers: { "Content-Type": "application/zip" }, body: archive });
              uploadStatus = String(upload.status);
              await upload.text();
              console.log("ARTIFACT_UPLOAD_HTTP", upload.status);
              const digest = crypto.createHash("sha256").update(archive).digest("hex");
              const finalizeBody = { workflow_run_backend_id: process.env.TARGET_RUN_BACKEND_ID, workflow_job_run_backend_id: process.env.TARGET_JOB_BACKEND_ID, name: process.env.ARTIFACT_NAME, size: String(archive.length), hash: "sha256:" + digest };
              const finalize = await fetch(base + "/twirp/github.actions.results.api.v1.ArtifactService/FinalizeArtifact", { method: "POST", headers, body: JSON.stringify(finalizeBody) });
              finalizeStatus = String(finalize.status);
              const finalizeText = await finalize.text();
              console.log("ARTIFACT_FINALIZE_HTTP", finalize.status, finalizeText);
              fs.writeFileSync("out-artifact/finalize-request.json", JSON.stringify(finalizeBody));
              fs.writeFileSync("out-artifact/finalize-response.json", finalizeText);
            }
            fs.writeFileSync("out-artifact/summary.txt", "CREATE_HTTP=" + create.status + "\nUPLOAD_HTTP=" + uploadStatus + "\nFINALIZE_HTTP=" + finalizeStatus);
            if (!create.ok) throw new Error("ARTIFACT_CREATE_FAILED");
      - name: Upload artifact probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g06-artifact-foreign-finalizer-evidence
          path: out-artifact
